[package]
name = "fluids"
version = "0.1.0"
edition = "2024"

# [lib]
# crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fluids"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
winit = { version = "0.30" }
env_logger = "0.10"
log = "0.4"
wgpu = "29.0"
pollster = "0.3"
bytemuck = { version = "1.25.0", features = [ "derive" ] }
cgmath = "0.18.0"
nalgebra = "0.34.0"
# NOTE: check https://crates.io/crates/ndarray-linalg for backends you can use in your system
ndarray-linalg = { version = "0.18.1", features = ["intel-mkl-system"] }
spatial_hash_3d = "0.1.6"
ndarray = "0.17.2"
flume = "0.12.0"

#[profile.release]
#debug = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "29.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3.69", features = [
    "Document",
    "Window",
    "Element",
]}

