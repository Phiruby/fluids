[project]
name = "fluids"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Phiruby", email = "vilohithrao@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[project.scripts]
fluids = "fluids:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
fluids = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
openvdb = ">=13.1.0,<14"
numpy = ">=2.5.3,<3"
